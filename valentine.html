<body style="text-align:center; background-color:#ffe6f0;">
    <div id="index"><h1>hello my shaylaa😍</h1>
    
     <div class="container1">
  <img src="pandas.png" alt="pandas" width="200">
  <p>Will you be my Valentine? 🫣❤️</p>
</div>

    <div class="container">
    <div class="box"><a href="index.html"><button>Yes🥹</button></a></div>
    
    <div class="box" >
        <button class="no">No😶</button></div>
        </div></div>
        <div class="hearts">
            
  <!-- plusieurs coeurs avec positions aléatoires -->
  <div class="heart" style="left:5%; animation-duration:6s; animation-delay:0s;"></div>
  <div class="heart" style="left:15%; animation-duration:8s; animation-delay:2s;"></div>
  <div class="heart" style="left:25%; animation-duration:5s; animation-delay:1s;"></div>
  <div class="heart" style="left:35%; animation-duration:7s; animation-delay:3s;"></div>
  <div class="heart" style="left:45%; animation-duration:6s; animation-delay:0.5s;"></div>
  <div class="heart" style="left:55%; animation-duration:9s; animation-delay:1.5s;"></div>
  <div class="heart" style="left:65%; animation-duration:6s; animation-delay:2.5s;"></div>
  <div class="heart" style="left:75%; animation-duration:8s; animation-delay:0.8s;"></div>
  <div class="heart" style="left:85%; animation-duration:7s; animation-delay:1.2s;"></div>
  <div class="heart" style="left:95%; animation-duration:5s; animation-delay:3.5s;"></div>
</div>

  <script>
const noButton = document.querySelector('.container .box:nth-child(2) button');

noButton.addEventListener('mouseenter', () => {
    const container = noButton.parentElement.parentElement; // .container
    const containerRect = container.getBoundingClientRect();
    const buttonRect = noButton.getBoundingClientRect();

    // calcule nouvelle position aléatoire dans le container
    const maxX = containerRect.width - buttonRect.width;
    const maxY = containerRect.height - buttonRect.height;

    const newX = Math.random() * maxX;
    const newY = Math.random() * maxY;

    // applique position
    noButton.style.position = 'absolute';
    noButton.style.left = `${newX}px`;
    noButton.style.top = `${newY}px`;
});
</script>

</body>
